    <script>
        // Block semua navigasi balik
        history.pushState(null, '', location.href);
        window.addEventListener('popstate', () => {
            history.pushState(null, '', location.href);
        });

        // Block keyboard shortcuts (Alt+Left, Backspace, dsb)
        document.addEventListener('keydown', (e) => {
            if (
                e.key === 'Backspace' ||
                (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) ||
                e.key === 'Escape'
            ) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);

        // Block context menu
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // Block swipe gestures (mobile back gesture)
        document.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX < 20 || e.touches[0].clientX > window.innerWidth - 20) {
                e.preventDefault();
            }
        }, { passive: false });

        // Keep pushing state supaya tombol back ketrap terus
        setInterval(() => {
            history.pushState(null, '', location.href);
        }, 500);
    </script>
